name: docker_wsl_rails

services:
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    ports:
      - "3000:3000"
      - "3036:3036"
    volumes:
      - .:/rails                      # ローカルのコードをコンテナ内にマウントして即時反映
    environment:
      - RAILS_ENV=development
    tty: true                         # binding.pry などのデバッガを使えるようにする
    stdin_open: true                  # 同上
